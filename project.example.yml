name: Zumbo

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

packages:
  # The speech pipeline, a local package in this repo. FluidAudio comes in
  # transitively, pinned exactly at 0.15.7 by Engine/Package.swift.
  VesperEngine:
    path: Engine
  # Sparkle 2: the updater. Its framework is embedded in the app bundle and
  # carries its own XPC services, which scripts/release.sh signs inside-out.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Zumbo:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: VesperEngine
        product: VesperEngine
      - package: Sparkle
        product: Sparkle
      - sdk: ServiceManagement.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: Zumbo
        PRODUCT_BUNDLE_IDENTIFIER: com.example.zumbo
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: "YOURTEAMID"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ONLY_ACTIVE_ARCH: YES
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Zumbo
        CFBundleDisplayName: Zumbo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright 2026 Your Name. All rights reserved."
        NSMicrophoneUsageDescription: "Zumbo listens to your microphone only while you dictate, and turns that audio into text on this Mac."
        NSAppleEventsUsageDescription: "Zumbo uses Apple Events to paste your finished transcript into the app you were typing in."
        SUFeedURL: https://example.com/appcast.xml
        SUPublicEDKey: YOUR_SPARKLE_PUBLIC_KEY
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        CFBundleURLTypes:
          - CFBundleURLName: com.example.zumbo.activate
            CFBundleURLSchemes:
              - zumbo
    entitlements:
      path: Support/Zumbo.entitlements
      properties:
        com.apple.security.device.audio-input: true
